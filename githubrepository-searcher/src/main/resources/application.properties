# =====================================================================
# GitHub Repository Searcher - Application Properties
# =====================================================================

spring.application.name=githubrepository-searcher

# ---------------------------------------------------------------------
# PostgreSQL datasource (Render-compatible with environment variable fallback)
# ---------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/githubrepositorysearcher}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234@}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# GitHub REST API configuration
# ---------------------------------------------------------------------
github.api.base-url=https://api.github.com
github.api.search-repositories=/search/repositories
github.api.per-page=30

# ---------------------------------------------------------------------
# Server (Render injects $PORT automatically)
# ---------------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.context-path=

# ---------------------------------------------------------------------
# SpringDoc OpenAPI / Swagger UI
# ---------------------------------------------------------------------
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.freightfox.githubsearcher

# ---------------------------------------------------------------------
# Jackson - case-insensitive JSON property names for POST request bodies
# ---------------------------------------------------------------------
spring.jackson.mapper.accept-case-insensitive-properties=true

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.com.freightfox.githubsearcher=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
