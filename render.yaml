services:
  # =====================================================================
  # Managed PostgreSQL database (required by the Spring Boot app)
  # =====================================================================
  - type: postgres
    name: githubrepositorysearcher-db
    plan: starter
    databaseName: githubrepositorysearcher
    user: githubrepositorysearcher

  # =====================================================================
  # Web service - GitHub Repository Searcher (Docker)
  # =====================================================================
  - type: web
    name: githubrepositorysearcher
    env: docker
    repo: https://github.com/Dineshrd0503/GithubRepositorySearcher
    dockerfilePath: ./githubrepository-searcher/Dockerfile
    dockerContext: ./githubrepository-searcher
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
    # Health check so Render knows the service is up
    healthCheckPath: /api/github/repositories
