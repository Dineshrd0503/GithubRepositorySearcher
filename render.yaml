services:
  - type: web
    name: githubrepositorysearcher
    env: docker
    repo: https://github.com/Dineshrd0503/GithubRepositorySearcher
    dockerfilePath: ./githubrepository-searcher/Dockerfile
    dockerContext: ./githubrepository-searcher
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
